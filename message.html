<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伞通通 - 消息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            max-width: 375px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .container {
            padding: 15px;
            padding-bottom: 70px;
        }
        
        /* 顶部导航 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background-color: #4a90e2;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        
        .header-icons {
            display: flex;
            gap: 15px;
        }
        
        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #eee;
            max-width: 375px;
            margin: 0 auto;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            color: #666;
            text-decoration: none;
        }
        
        .nav-item.active {
            color: #4a90e2;
        }
        
        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* 消息列表 */
        .message-list {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .message-item {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .message-item:hover {
            background-color: #f9f9f9;
        }
        
        .message-item:last-child {
            border-bottom: none;
        }
        
        .message-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #eee;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            flex-shrink: 0;
        }
        
        .message-content {
            flex: 1;
            min-width: 0;
        }
        
        .message-title {
            font-weight: 600;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }
        
        .message-time {
            font-size: 12px;
            color: #999;
        }
        
        .message-preview {
            font-size: 14px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 消息分类 */
        .message-category {
            margin-bottom: 20px;
        }
        
        .category-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
            padding-left: 10px;
        }
        
        /* 聊天界面 */
        .chat-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            max-width: 375px;
            height: 100%;
            background-color: white;
            z-index: 200;
            flex-direction: column;
            margin: 0 auto;
        }
        
        .chat-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: #4a90e2;
            color: white;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .chat-back {
            font-size: 20px;
            margin-right: 15px;
            cursor: pointer;
        }
        
        .chat-title {
            font-size: 16px;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }
        
        .message-bubble.received {
            align-self: flex-start;
            background-color: #f0f0f0;
            border-bottom-left-radius: 5px;
        }
        
        .message-bubble.sent {
            align-self: flex-end;
            background-color: #4a90e2;
            color: white;
            border-bottom-right-radius: 5px;
        }
        
        .message-time-small {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
            text-align: right;
        }
        
        .message-bubble.received .message-time-small {
            text-align: left;
        }
        
        .chat-input-area {
            display: flex;
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: white;
        }
        
        .chat-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }
        
        .chat-send {
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        /* 未读消息标记 */
        .unread-badge {
            background-color: #ff4757;
            color: white;
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 11px;
            margin-left: 5px;
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(74, 144, 226, 0.3);
            border-radius: 50%;
            border-top-color: #4a90e2;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 消息发送时间 */
        .time-divider {
            text-align: center;
            margin: 15px 0;
            font-size: 12px;
            color: #999;
            position: relative;
        }
        
        .time-divider::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #eee;
            z-index: -1;
        }
        
        .time-divider span {
            background-color: white;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="header">
        <h1>消息</h1>
        <div class="header-icons">
            <span>🔍</span>
            <span>⏰</span>
        </div>
    </div>
    
    <!-- 消息内容 -->
    <div class="container">
        <!-- 系统消息 -->
        <div class="message-category">
            <div class="category-title">系统消息</div>
            <div class="message-list">
                <div class="message-item" data-id="system1">
                    <div class="message-avatar">系</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>系统通知</span>
                            <span class="message-time">10:30</span>
                        </div>
                        <div class="message-preview">您的送伞订单已被接单，骑手正在赶往取伞点</div>
                    </div>
                </div>
                
                <div class="message-item" data-id="system2">
                    <div class="message-avatar">系</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>订单完成</span>
                            <span class="message-time">昨天</span>
                        </div>
                        <div class="message-preview">您的送伞订单已完成，感谢使用伞通通服务</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 天气预警 -->
        <div class="message-category">
            <div class="category-title">天气预警</div>
            <div class="message-list">
                <div class="message-item" data-id="weather1">
                    <div class="message-avatar">天</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>天气预警</span>
                            <span class="message-time">09:15</span>
                        </div>
                        <div class="message-preview">今日下午有雷阵雨，请提前做好准备</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 伞友匹配 -->
        <div class="message-category">
            <div class="category-title">伞友匹配</div>
            <div class="message-list">
                <div class="message-item" data-id="match1">
                    <div class="message-avatar">伞</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>伞友匹配</span>
                            <span class="message-time">昨天</span>
                        </div>
                        <div class="message-preview">您与小明匹配成功，请确认行程信息</div>
                    </div>
                </div>
                
                <div class="message-item" data-id="match2">
                    <div class="message-avatar">伞</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>匹配提醒</span>
                            <span class="message-time">2天前</span>
                        </div>
                        <div class="message-preview">附近有伞友与您路线匹配，是否发起共享？</div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- 聊天 -->
        <div class="message-category">
            <div class="category-title">聊天</div>
            <div class="message-list">
                <div class="message-item" data-id="chat1">
                    <div class="message-avatar">客</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>客服中心</span>
                            <span class="message-time">昨天</span>
                        </div>
                        <div class="message-preview">您好，有什么可以帮助您的吗？</div>
                    </div>
                </div>
                
                <div class="message-item" data-id="chat2">
                    <div class="message-avatar">李</div>
                    <div class="message-content">
                        <div class="message-title">
                            <span>李师傅</span>
                            <span class="message-time">3天前</span>
                        </div>
                        <div class="message-preview">您好，我已到达取伞点，请确认位置</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 聊天界面 -->
    <div id="chat-container" class="chat-container">
        <div class="chat-header">
            <div class="chat-back" id="chat-back">←</div>
            <div class="chat-title" id="chat-title">客服中心</div>
        </div>
        
        <div class="chat-messages" id="chat-messages">
            <!-- 消息将动态添加 -->
        </div>
        
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="输入消息...">
            <button class="chat-send" id="chat-send">➤</button>
        </div>
    </div>
    
    <!-- 底部导航 -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon">🏠</div>
            <div>主页</div>
        </a>
        <a href="service.html" class="nav-item">
            <div class="nav-icon">🌂</div>
            <div>伞服务</div>
        </a>
        <a href="community.html" class="nav-item">
            <div class="nav-icon">👥</div>
            <div>社区</div>
        </a>
        <a href="message.html" class="nav-item active">
            <div class="nav-icon">💬</div>
            <div>消息</div>
        </a>
        <a href="profile.html" class="nav-item">
            <div class="nav-icon">👤</div>
            <div>我的</div>
        </a>
    </div>
    
    <script>
        // 聊天数据
        const chatData = {
            "system1": {
                title: "系统通知",
                messages: [
                    { type: "received", text: "您的送伞订单已被接单，骑手正在赶往取伞点", time: "10:30" }
                ]
            },
            "system2": {
                title: "订单完成",
                messages: [
                    { type: "received", text: "您的送伞订单已完成，感谢使用伞通通服务", time: "昨天 14:20" }
                ]
            },
            "weather1": {
                title: "天气预警",
                messages: [
                    { type: "received", text: "今日下午有雷阵雨，请提前做好准备", time: "09:15" }
                ]
            },
            "match1": {
                title: "伞友匹配",
                messages: [
                    { type: "received", text: "您与小明匹配成功，请确认行程信息", time: "昨天 16:45" }
                ]
            },
            "match2": {
                title: "匹配提醒",
                messages: [
                    { type: "received", text: "附近有伞友与您路线匹配，是否发起共享？", time: "2天前 10:30" }
                ]
            },
            "chat1": {
                title: "客服中心",
                messages: [
                    { type: "received", text: "您好，有什么可以帮助您的吗？", time: "昨天 11:20" },
                    { type: "sent", text: "我的送伞订单状态如何？", time: "昨天 11:25" },
                    { type: "received", text: "您的订单已被接单，骑手正在路上，预计10分钟内到达", time: "昨天 11:26" }
                ]
            },
            "chat2": {
                title: "李师傅",
                messages: [
                    { type: "received", text: "您好，我已到达取伞点，请确认位置", time: "3天前 15:30" },
                    { type: "sent", text: "我在办公楼一楼大厅，穿蓝色衣服", time: "3天前 15:32" },
                    { type: "received", text: "好的，我马上到", time: "3天前 15:33" }
                ]
            }
        };
        
        // 当前聊天ID
        let currentChatId = null;
        
        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
        });
        
        // 设置事件监听器
        function setupEventListeners() {
            // 消息项点击事件
            document.querySelectorAll('.message-item').forEach(item => {
                item.addEventListener('click', function() {
                    const chatId = this.dataset.id;
                    openChat(chatId);
                });
            });
            
            // 返回按钮
            document.getElementById('chat-back').addEventListener('click', function() {
                closeChat();
            });
            
            // 发送消息
            document.getElementById('chat-send').addEventListener('click', function() {
                sendMessage();
            });
            
            // 输入框回车发送
            document.getElementById('chat-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
        }
        
        // 打开聊天
        function openChat(chatId) {
            currentChatId = chatId;
            const chat = chatData[chatId];
            
            if (!chat) return;
            
            // 更新聊天标题
            document.getElementById('chat-title').textContent = chat.title;
            
            // 渲染消息
            renderMessages(chat.messages);
            
            // 显示聊天界面
            document.getElementById('chat-container').style.display = 'flex';
            
            // 滚动到底部
            scrollToBottom();
        }
        
        // 关闭聊天
        function closeChat() {
            document.getElementById('chat-container').style.display = 'none';
            currentChatId = null;
            
            // 清空输入框
            document.getElementById('chat-input').value = '';
        }
        
        // 渲染消息
        function renderMessages(messages) {
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.innerHTML = '';
            
            let lastDate = null;
            
            messages.forEach(message => {
                // 添加时间分隔线（如果日期变化）
                const messageDate = message.time.split(' ')[0];
                if (messageDate !== lastDate) {
                    const timeDivider = document.createElement('div');
                    timeDivider.className = 'time-divider';
                    timeDivider.innerHTML = `<span>${messageDate}</span>`;
                    messagesContainer.appendChild(timeDivider);
                    lastDate = messageDate;
                }
                
                // 创建消息气泡
                const messageElement = document.createElement('div');
                messageElement.className = `message-bubble ${message.type}`;
                
                messageElement.innerHTML = `
                    <div class="message-text">${message.text}</div>
                    <div class="message-time-small">${message.time}</div>
                `;
                
                messagesContainer.appendChild(messageElement);
            });
        }
        
        // 发送消息
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            
            if (!text || !currentChatId) return;
            
            // 获取当前时间
            const now = new Date();
            const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            // 添加消息到数据
            const newMessage = {
                type: "sent",
                text: text,
                time: timeString
            };
            
            chatData[currentChatId].messages.push(newMessage);
            
            // 重新渲染消息
            renderMessages(chatData[currentChatId].messages);
            
            // 清空输入框
            input.value = '';
            
            // 滚动到底部
            scrollToBottom();
            
            // 模拟回复（仅对聊天类型）
            if (currentChatId.startsWith('chat')) {
                setTimeout(() => {
                    const replies = [
                        "收到您的消息，我们会尽快处理",
                        "好的，明白",
                        "感谢您的反馈",
                        "请问还有其他问题吗？"
                    ];
                    
                    const randomReply = replies[Math.floor(Math.random() * replies.length)];
                    
                    const replyMessage = {
                        type: "received",
                        text: randomReply,
                        time: `${now.getHours().toString().padStart(2, '0')}:${(now.getMinutes() + 1).toString().padStart(2, '0')}`
                    };
                    
                    chatData[currentChatId].messages.push(replyMessage);
                    renderMessages(chatData[currentChatId].messages);
                    scrollToBottom();
                }, 1000);
            }
        }
        
        // 滚动到底部
        function scrollToBottom() {
            const messagesContainer = document.getElementById('chat-messages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
    </script>
</body>
</html>
